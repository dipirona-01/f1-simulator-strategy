<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Estratégia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Simulador de Estratégia</h1>
        <p>Estratégias para Corrida</p>
    </header>
    <main>
        <form id="formulario">
            <div>
                <p>Número de Voltas</p>
                <input type="number" name="ntxt" id="voltas" min="1" required class="voltas">
            </div>
            
            <div id="escolhapneu"></div>
            <p>Estratégia</p>
            <div class="escolha">
                
                <input type="radio" name="parada" id="1p" required class="escolha">


                <label for="1p" class="botao">1 Parada</label>

                <input type="radio" name="parada" id="2p" required class="escolha">
                
                <label for="2p" class="botao">2 Paradas</label>

                
               
            </div>
            <div>
                <input type="submit" value="Simular Estrategia" class="submit">
            </div>
        </form>   
        <div id="resultado"></div>
    </main>
    <footer>

    </footer>

    <script src="script.js"></script>
</body>
</html>
